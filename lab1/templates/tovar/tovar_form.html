{% extends 'base.html' %}

{% block title %}Форма товара{% endblock %}

{% block content %}
<h2>Добавление или изменение товара</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="button">Сохранить</button>
</form>

<a href="{% url 'tovar_list' %}">Назад к товарам</a>
{% endblock %}
